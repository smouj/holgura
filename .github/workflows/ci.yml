name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build application
        run: dotnet build Holgura.App/Holgura.App.csproj -c Release

      - name: Test core
        run: dotnet test tests/Holgura.Core.Tests/Holgura.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Test engine
        run: dotnet test tests/Holgura.Engine.Tests/Holgura.Engine.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish installer payload
        run: dotnet publish Holgura.App/Holgura.App.csproj -c Release -r win-x64 --self-contained true -p:Version=1.1.0 -o artifacts/win-x64

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler /DAppVersion=1.1.0 installer\Holgura.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

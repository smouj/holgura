name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/Holgura.App/Holgura.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64

      - name: Zip
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/Holgura-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Holgura-win-x64.zip

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish Holgura.App/Holgura.App.csproj -c Release -r win-x64 --self-contained true "-p:Version=$version" -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/Holgura-win-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build per-user installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=$version" installer\Holgura.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Holgura-Setup-win-x64.exe
            artifacts/Holgura-win-x64.zip
